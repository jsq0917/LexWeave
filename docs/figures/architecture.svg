<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="'Source Han Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8794"/>
    </marker>
    <marker id="arwBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/>
    </marker>
    <marker id="arwRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4553f"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="46" font-size="23" font-weight="600" fill="#1b2733">LexWeave 架构：场景中心的三层法律图谱 → 双路检索 → 确定性闸门</text>
  <text x="40" y="74" font-size="14" fill="#6b7785">1,465 条法条 · 218 概念 · 53 场景 · 4,259 边（其中概念层 541 条人工编写） ｜ 评测：60 条多跳金标，三档消融带配对 bootstrap 区间</text>
  <line x1="40" y1="88" x2="1160" y2="88" stroke="#e3e8ee" stroke-width="1"/>

  <!-- ============ 第一层：语料与抽取 ============ -->
  <text x="40" y="118" font-size="13" font-weight="600" fill="#8a94a0">① 语料与抽取</text>

  <g>
    <rect x="40" y="130" width="250" height="92" rx="8" fill="#f5f8fc" stroke="#cfdcea"/>
    <text x="56" y="154" font-size="13" font-weight="600" fill="#1b2733">法条原文 1,465 条</text>
    <text x="56" y="176" font-size="12" fill="#5b6673">民法典 1,260 · 劳动法 107</text>
    <text x="56" y="196" font-size="12" fill="#5b6673">劳动合同法 98</text>
    <text x="56" y="214" font-size="11" fill="#8a94a0">data/extracted/articles.jsonl</text>
  </g>

  <line x1="296" y1="176" x2="336" y2="176" stroke="#7c8794" stroke-width="1.4" marker-end="url(#arw)"/>

  <g>
    <rect x="342" y="130" width="318" height="92" rx="8" fill="#f5f8fc" stroke="#cfdcea"/>
    <text x="358" y="154" font-size="13" font-weight="600" fill="#1b2733">抽取：规则 + 人工词表</text>
    <text x="358" y="176" font-size="12" fill="#5b6673">概念/别名/条号正则 · 场景 53 个由人工定义</text>
    <text x="358" y="196" font-size="12" fill="#5b6673">每条边带 provenance：rule / manual / regex</text>
    <text x="358" y="214" font-size="11" fill="#8a94a0">concepts.jsonl · mentions.jsonl · scenarios.jsonl</text>
  </g>

  <line x1="666" y1="176" x2="706" y2="176" stroke="#7c8794" stroke-width="1.4" marker-end="url(#arw)"/>

  <g>
    <rect x="712" y="130" width="448" height="92" rx="8" fill="#fdf8f3" stroke="#e8d5c0"/>
    <text x="728" y="154" font-size="13" font-weight="600" fill="#1b2733">为什么是三层而不是两跳</text>
    <text x="728" y="176" font-size="12" fill="#5b6673">条文互引只有 97 条（CITES），撑不起多跳 → 另立概念层</text>
    <text x="728" y="196" font-size="12" fill="#5b6673">Scenario 承接用户口语提问，Concept 承接法律术语</text>
    <text x="728" y="214" font-size="11" fill="#8a94a0">详见 README §3 · 决策记录见 §12 第 6 条</text>
  </g>

  <!-- ============ 第二层：图谱 ============ -->
  <text x="40" y="262" font-size="13" font-weight="600" fill="#8a94a0">② 三层图（NetworkX 镜像 / Neo4j 同构）</text>

  <g>
    <rect x="150" y="276" width="300" height="46" rx="8" fill="#eef4fb" stroke="#a9c6e4"/>
    <text x="300" y="296" font-size="13" font-weight="600" fill="#1b2733" text-anchor="middle">Scenario　53</text>
    <text x="300" y="313" font-size="11" fill="#5b6673" text-anchor="middle">拖欠工资 · 违法解除 · 竞业限制 …</text>
  </g>

  <g>
    <rect x="150" y="366" width="300" height="46" rx="8" fill="#eef4fb" stroke="#a9c6e4"/>
    <text x="300" y="386" font-size="13" font-weight="600" fill="#1b2733" text-anchor="middle">Concept　218</text>
    <text x="300" y="403" font-size="11" fill="#5b6673" text-anchor="middle">劳动关系 · 经济补偿 · 试用期 …</text>
  </g>

  <g>
    <rect x="150" y="456" width="300" height="46" rx="8" fill="#eef4fb" stroke="#a9c6e4"/>
    <text x="300" y="476" font-size="13" font-weight="600" fill="#1b2733" text-anchor="middle">Article　1,465</text>
    <text x="300" y="493" font-size="11" fill="#5b6673" text-anchor="middle">民法典 / 劳动法 / 劳动合同法条文</text>
  </g>

  <!-- 边标注 -->
  <line x1="300" y1="322" x2="300" y2="360" stroke="#2f6fb3" stroke-width="1.6" marker-end="url(#arwBlue)"/>
  <text x="312" y="345" font-size="11.5" fill="#2f6fb3">APPLIES_TO　204</text>

  <line x1="300" y1="412" x2="300" y2="450" stroke="#2f6fb3" stroke-width="1.6" marker-end="url(#arwBlue)"/>
  <text x="312" y="435" font-size="11.5" fill="#2f6fb3">DEFINES　3,621（rule 抽取）</text>

  <!-- Concept 自环 -->
  <path d="M450,389 C536,389 536,300 462,300" fill="none" stroke="#b4553f" stroke-width="1.5" marker-end="url(#arwRed)"/>
  <text x="546" y="338" font-size="11.5" fill="#b4553f">REQUIRES 209</text>
  <text x="546" y="354" font-size="11.5" fill="#b4553f">SPECIAL_OF 128</text>
  <text x="546" y="370" font-size="11" fill="#8a94a0">541 条全部人工编写</text>

  <!-- Article CITES：小自环 -->
  <path d="M450,468 C486,468 486,492 452,492" fill="none" stroke="#7c8794" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="496" y="486" font-size="11.5" fill="#6b7785">CITES 97</text>

  <g>
    <rect x="640" y="366" width="520" height="136" rx="8" fill="#f7f9fb" stroke="#dde3ea"/>
    <text x="656" y="390" font-size="12.5" font-weight="600" fill="#1b2733">落库策略</text>
    <text x="656" y="413" font-size="12" fill="#5b6673">Neo4j 可用则直连；连不上自动回落 NetworkX pkl，</text>
    <text x="656" y="433" font-size="12" fill="#5b6673">所有评测都能在无 Docker 环境复现（本机即此路径）。</text>
    <text x="656" y="461" font-size="12" fill="#5b6673">⚠ 已知局限：3 条 Cypher 尚未在真实 Neo4j 实例上执行过，</text>
    <text x="656" y="481" font-size="12" fill="#8a94a0">　 见 README §12 第 8 条。</text>
  </g>
  <!-- ============ 第三层：双路检索 ============ -->
  <text x="40" y="540" font-size="13" font-weight="600" fill="#8a94a0">③ 双路检索 + 路由</text>

  <g>
    <rect x="40" y="552" width="330" height="96" rx="8" fill="#eef4fb" stroke="#a9c6e4"/>
    <text x="56" y="576" font-size="13" font-weight="600" fill="#1b2733">文本路</text>
    <text x="56" y="598" font-size="12" fill="#5b6673">BM25（jieba）+ bge-m3 dense</text>
    <text x="56" y="618" font-size="12" fill="#5b6673">→ RRF 融合 → 精排 bge-reranker</text>
    <text x="56" y="638" font-size="11.5" fill="#8a94a0">R@5 0.6972 ｜ 中位 199 ms</text>
  </g>

  <g>
    <rect x="390" y="552" width="330" height="96" rx="8" fill="#fdf1ee" stroke="#e0b8ab"/>
    <text x="406" y="576" font-size="13" font-weight="600" fill="#1b2733">图路</text>
    <text x="406" y="598" font-size="12" fill="#5b6673">实体链接 bge-large-zh → 命中 Concept</text>
    <text x="406" y="618" font-size="12" fill="#5b6673">→ 2 跳扩展 → 回捞 DEFINES 条文</text>
    <text x="406" y="638" font-size="11.5" fill="#8a94a0">R@5 0.4333 ｜ 路径准确 0.5583 ｜ 32 ms</text>
  </g>

  <g>
    <rect x="740" y="552" width="420" height="96" rx="8" fill="#f2f8f4" stroke="#b6d3c1"/>
    <text x="756" y="576" font-size="13" font-weight="600" fill="#1b2733">路由：simple / medium / complex</text>
    <text x="756" y="598" font-size="12" fill="#5b6673">规则版 0.6625 ｜ LR 留一 0.650（n=80）</text>
    <text x="756" y="618" font-size="12" fill="#b4553f">未达 85% 目标 —— medium 与 complex 特征重合</text>
    <text x="756" y="638" font-size="11.5" fill="#8a94a0">如实披露，未为凑指标改口径</text>
  </g>

  <!-- ============ 第四层：编排与闸门 ============ -->
  <text x="40" y="690" font-size="13" font-weight="600" fill="#8a94a0">④ 编排与安全闸门（LangGraph，按消融结论定默认架构）</text>

  <g>
    <rect x="40" y="702" width="330" height="112" rx="8" fill="#f7f9fb" stroke="#dde3ea"/>
    <text x="56" y="726" font-size="13" font-weight="600" fill="#1b2733">三档编排（消融对象）</text>
    <text x="56" y="748" font-size="12" fill="#5b6673">A 档　单链路，1 次 LLM 调用</text>
    <text x="56" y="768" font-size="12" fill="#5b6673">B 档　多 Agent 协商，2 次调用</text>
    <text x="56" y="788" font-size="12" fill="#5b6673">C 档　多 Agent + 五道闸门，2 次调用</text>
    <text x="56" y="806" font-size="11" fill="#2f6fb3">默认上线＝A 档链路 + 五闸（B 档只作对照）</text>
  </g>

  <g>
    <rect x="390" y="702" width="400" height="112" rx="8" fill="#eef4fb" stroke="#a9c6e4"/>
    <text x="406" y="726" font-size="13" font-weight="600" fill="#1b2733">五道确定性闸门（不依赖 LLM）</text>
    <text x="406" y="748" font-size="12" fill="#5b6673">① 引用存在性　② 关系端点合法</text>
    <text x="406" y="768" font-size="12" fill="#5b6673">③ 数值一致性　④ 拒答阈值</text>
    <text x="406" y="788" font-size="12" fill="#5b6673">⑤ 多轮槽位一致性</text>
    <text x="406" y="806" font-size="11" fill="#8a94a0">C 档全闸通过率 0.5667，修复率 0.4667</text>
  </g>

  <g>
    <rect x="810" y="702" width="350" height="112" rx="8" fill="#f2f8f4" stroke="#b6d3c1"/>
    <text x="826" y="726" font-size="13" font-weight="600" fill="#1b2733">输出与人工介入</text>
    <text x="826" y="748" font-size="12" fill="#5b6673">答案 + 引用条文 + 图上路径</text>
    <text x="826" y="768" font-size="12" fill="#5b6673">低置信 → 挂起 → 人工确认 → 恢复</text>
    <text x="826" y="788" font-size="12" fill="#5b6673">修正记录落 SQLite，可统计介入率</text>
    <text x="826" y="806" font-size="11" fill="#8a94a0">支持进程重启后续跑（3/3 E2E 通过）</text>
  </g>

  <!-- ============ 底部：评测 ============ -->
  <line x1="40" y1="836" x2="1160" y2="836" stroke="#e3e8ee" stroke-width="1"/>
  <text x="40" y="862" font-size="12.5" font-weight="600" fill="#8a94a0">评测物证</text>
  <g font-size="11.5" fill="#5b6673">
    <rect x="140" y="846" width="180" height="26" rx="13" fill="#f5f8fc" stroke="#cfdcea"/>
    <text x="230" y="864" text-anchor="middle">60 条多跳金标（30/20/10）</text>

    <rect x="332" y="846" width="170" height="26" rx="13" fill="#f5f8fc" stroke="#cfdcea"/>
    <text x="417" y="864" text-anchor="middle">路径断点 0 · κ 0.79</text>

    <rect x="514" y="846" width="196" height="26" rx="13" fill="#f5f8fc" stroke="#cfdcea"/>
    <text x="612" y="864" text-anchor="middle">三档 × 60 条 · 9 项指标</text>

    <rect x="722" y="846" width="206" height="26" rx="13" fill="#f5f8fc" stroke="#cfdcea"/>
    <text x="825" y="864" text-anchor="middle">配对 bootstrap 100 次 → 95% CI</text>

    <rect x="940" y="846" width="220" height="26" rx="13" fill="#fdf8f3" stroke="#e8d5c0"/>
    <text x="1050" y="864" text-anchor="middle">所有数字可用 scripts/ 复算</text>
  </g>
</svg>
