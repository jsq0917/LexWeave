[project]
name = "lexweave"
version = "0.1.0"
description = "LexWeave: scenario-centric legal knowledge graph + dual-path retrieval + multi-agent orchestration"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "networkx>=3.3",
  "neo4j>=5.20",
  "faiss-cpu>=1.8",
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "sentence-transformers>=3.0",
  "openai>=1.30",
  "langgraph>=0.2.0",
  "langchain-core>=0.2.30",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.36",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "orjson>=3.10",
  "tenacity>=8.3",
  "tqdm>=4.66",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]
gpu = ["torch>=2.4"]

[tool.uv]
# torch 走 cu130 索引；CPU-only 环境用 `uv sync --extra dev` 即可，embedding 会自动回落 CPU。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
